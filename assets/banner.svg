<svg xmlns="http://www.w3.org/2000/svg" width="890" height="260" viewBox="0 0 890 260">
  <defs>
    <linearGradient id="pbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D222B"/>
      <stop offset="0.55" stop-color="#103039"/>
      <stop offset="1" stop-color="#0A1A21"/>
    </linearGradient>
    <linearGradient id="barT" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#2EC4B6" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#7FE7DC" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="barG" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#F2C811" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#F9DE69" stop-opacity="0.95"/>
    </linearGradient>
  </defs>
  <rect width="890" height="260" fill="url(#pbg)" rx="14"/>
  <rect x="0" y="0" width="890" height="3" fill="#2EC4B6" opacity="0.9"/>
  <g opacity="0.08" stroke="#7FE7DC">
    <line x1="0" y1="65" x2="890" y2="65"/>
    <line x1="0" y1="130" x2="890" y2="130"/>
    <line x1="0" y1="195" x2="890" y2="195"/>
    <line x1="120" y1="0" x2="120" y2="260"/>
    <line x1="240" y1="0" x2="240" y2="260"/>
    <line x1="360" y1="0" x2="360" y2="260"/>
  </g>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="56" y="74" font-size="11.5" letter-spacing="3" fill="#2EC4B6" opacity="0">MOHAMMAD KHAIRY &#183; PORTFOLIO
      <animate attributeName="opacity" from="0" to="1" dur="0.7s" begin="0.2s" fill="freeze"/>
    </text>
    <rect x="56" y="92" width="46" height="4" fill="#F2C811">
      <animate attributeName="width" values="0;46" dur="0.7s" begin="0.3s" fill="freeze"/>
    </rect>
    <text x="56" y="140" font-size="40" font-weight="700" fill="#FFFFFF" opacity="0">Data, designed to be
      <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="0.5s" fill="freeze"/>
    </text>
    <text x="56" y="188" font-size="40" font-weight="700" fill="#F2C811" opacity="0">understood.
      <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="0.9s" fill="freeze"/>
    </text>
    <text x="56" y="222" font-size="14.5" fill="#B9D6D2" opacity="0">Interactive dashboards &#183; English and Arabic &#183; Dark and light
      <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="1.3s" fill="freeze"/>
    </text>
  </g>
  <!-- browser window mock -->
  <g>
    <rect x="600" y="52" width="236" height="160" rx="10" fill="#0A1A21" stroke="#2EC4B6" stroke-opacity="0.45"/>
    <rect x="600" y="52" width="236" height="26" rx="10" fill="#123540"/>
    <rect x="600" y="68" width="236" height="10" fill="#123540"/>
    <circle cx="618" cy="65" r="4" fill="#F2C811"/>
    <circle cx="634" cy="65" r="4" fill="#2EC4B6"/>
    <circle cx="650" cy="65" r="4" fill="#3E5C63"/>
    <rect x="662" y="60" width="158" height="10" rx="5" fill="#0D2A33"/>
    <!-- mini dashboard bars: grow on load -->
    <rect x="620" y="196" width="16" height="0" rx="3" fill="url(#barT)">
      <animate attributeName="height" values="0;46" dur="0.9s" begin="0.4s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.2 1" keyTimes="0;1"/>
      <animate attributeName="y" values="196;150" dur="0.9s" begin="0.4s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.2 1" keyTimes="0;1"/>
    </rect>
    <rect x="644" y="196" width="16" height="0" rx="3" fill="url(#barG)">
      <animate attributeName="height" values="0;70" dur="0.9s" begin="0.55s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.2 1" keyTimes="0;1"/>
      <animate attributeName="y" values="196;126" dur="0.9s" begin="0.55s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.2 1" keyTimes="0;1"/>
    </rect>
    <rect x="668" y="196" width="16" height="0" rx="3" fill="url(#barT)">
      <animate attributeName="height" values="0;56" dur="0.9s" begin="0.7s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.2 1" keyTimes="0;1"/>
      <animate attributeName="y" values="196;140" dur="0.9s" begin="0.7s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.2 1" keyTimes="0;1"/>
    </rect>
    <rect x="692" y="196" width="16" height="0" rx="3" fill="url(#barG)">
      <animate attributeName="height" values="0;86" dur="0.9s" begin="0.85s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.2 1" keyTimes="0;1"/>
      <animate attributeName="y" values="196;110" dur="0.9s" begin="0.85s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.2 1" keyTimes="0;1"/>
    </rect>
    <rect x="716" y="196" width="16" height="0" rx="3" fill="url(#barT)">
      <animate attributeName="height" values="0;64" dur="0.9s" begin="1s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.2 1" keyTimes="0;1"/>
      <animate attributeName="y" values="196;132" dur="0.9s" begin="1s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.2 1" keyTimes="0;1"/>
    </rect>
    <!-- donut: sweeps in, then breathes -->
    <circle cx="782" cy="150" r="30" fill="none" stroke="#1E3A44" stroke-width="12"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 782 150" to="360 782 150" dur="9s" repeatCount="indefinite"/>
      <path d="M 782 120 A 30 30 0 0 1 810 160" fill="none" stroke="#F2C811" stroke-width="12" stroke-dasharray="95" stroke-dashoffset="95">
        <animate attributeName="stroke-dashoffset" from="95" to="0" dur="1s" begin="1.1s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.2 1" keyTimes="0;1"/>
      </path>
      <path d="M 810 160 A 30 30 0 0 1 766 172" fill="none" stroke="#2EC4B6" stroke-width="12" stroke-dasharray="95" stroke-dashoffset="95">
        <animate attributeName="stroke-dashoffset" from="95" to="0" dur="1s" begin="1.5s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.2 1" keyTimes="0;1"/>
      </path>
    </g>
    <circle cx="700" cy="104" r="4" fill="#F2C811">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="r" values="3;5;3" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <line x1="600" y1="196" x2="836" y2="196" stroke="#2EC4B6" stroke-opacity="0.35"/>
  </g>
</svg>
